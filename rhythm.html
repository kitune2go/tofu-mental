<title>すり潰されて豆腐メンタル EX5 定時まで豆腐</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: one-screen factory line. Status panel on top, conveyor lanes below, press line near the bottom. Single dark look on purpose (night-lit production floor). */
:root{
  --steel:#1b1d1f; --steel-2:#26292c; --steel-3:#33373b;
  --tofu:#f4f0e4; --tofu-shade:#d9d2bd;
  --hazard:#f2c230; --ink:#e8e6df; --dim:#9a9c98;
  --ok:#5fd38a; --warn:#f2c230; --bad:#ff5a4e;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --led:"DotGothic16","Osaka-Mono",monospace;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--steel);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-inline:16px;box-sizing:border-box}
header{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding-block:10px 8px;align-items:center}
.ttl{font-family:var(--display);font-size:1.15rem;letter-spacing:.02em;line-height:1.1;min-width:0}
.ttl small{display:block;font-family:var(--led);font-size:.7rem;color:var(--dim);letter-spacing:.12em}
.clock{font-family:var(--led);font-size:1.6rem;color:var(--hazard);font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.clock small{display:block;font-size:.62rem;color:var(--dim);letter-spacing:.1em}
.gauge{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-family:var(--led);font-size:.75rem;color:var(--dim)}
.bar{flex:1;height:10px;background:var(--steel-3);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .15s,background .3s}
#form{min-width:4.5em;text-align:right;color:var(--tofu)}
.stage{position:relative;flex:1;min-height:0;border-radius:6px;overflow:hidden;background:var(--steel-2)}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:12px;display:flex;justify-content:space-between;padding-inline:12px;font-family:var(--led);font-variant-numeric:tabular-nums;pointer-events:none}
.hud b{font-size:1.1rem;color:var(--tofu);font-weight:400}
.hud span{font-size:.65rem;color:var(--dim);display:block;letter-spacing:.1em}
#pauseBtn{position:absolute;right:10px;bottom:10px;font-family:var(--led);background:var(--steel-3);color:var(--ink);border:0;border-radius:4px;padding:6px 10px;font-size:.8rem;cursor:pointer}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:rgba(20,21,23,.9);text-align:center;overflow:auto}
.overlay h2{font-family:var(--display);font-size:clamp(1.6rem,7vw,2.4rem);margin:0;line-height:1.15;text-wrap:balance}
.overlay p{margin:0;color:var(--dim);font-size:.9rem;line-height:1.6;max-width:30em}
.cover{width:88px;height:88px;border-radius:6px;object-fit:cover;box-shadow:0 0 0 3px var(--steel-3)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opt{font-family:var(--led);background:var(--steel-3);color:var(--ink);border:2px solid transparent;border-radius:4px;padding:8px 12px;font-size:.9rem;cursor:pointer;min-width:5.5em}
.opt small{display:block;font-size:.65rem;color:var(--dim)}
.opt[aria-pressed="true"]{border-color:var(--hazard);color:var(--hazard)}
.start{font-family:var(--display);font-size:1.25rem;background:var(--hazard);color:#1b1d1f;border:0;border-radius:4px;padding:12px 28px;cursor:pointer;box-shadow:0 4px 0 #a9851c}
.start:active{transform:translateY(2px);box-shadow:0 2px 0 #a9851c}
button:focus-visible{outline:2px solid var(--tofu);outline-offset:2px}
.set{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-family:var(--led);font-size:.8rem;color:var(--dim);width:min(100%,300px)}
.set input{width:100%;accent-color:var(--hazard)}
.set output{color:var(--ink);min-width:4em;text-align:right;font-variant-numeric:tabular-nums}
.keys{font-family:var(--led);font-size:.75rem;color:var(--dim)}
.keys kbd{font-family:inherit;border:1px solid var(--steel-3);border-radius:3px;padding:1px 6px;color:var(--ink)}
.stamp{font-family:var(--display);font-size:clamp(2.2rem,11vw,3.4rem);color:var(--bad);border:4px solid currentColor;border-radius:8px;padding:2px 16px;transform:rotate(-8deg);line-height:1.1}
.stamp.good{color:var(--hazard)}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(100%,340px);font-family:var(--led)}
.res div{background:var(--steel-3);border-radius:4px;padding:6px 2px}
.res b{display:block;font-weight:400;font-size:1.1rem;color:var(--tofu);font-variant-numeric:tabular-nums}
.res span{font-size:.62rem;color:var(--dim)}
.score{font-family:var(--led);font-size:2rem;color:var(--tofu);font-variant-numeric:tabular-nums}
.loading{font-family:var(--led);color:var(--hazard)}
footer{font-family:var(--led);font-size:.62rem;color:var(--dim);padding-block:6px 8px;text-align:center;letter-spacing:.08em}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>


<div id="app">
  <header>
    <div class="ttl">定時まで豆腐<small>BREEZYLIED196 · 143.6 BPM</small></div>
    <div class="clock"><span id="clock">08:00</span><small>退勤 17:00</small></div>
    <div class="gauge">メンタル残量<div class="bar"><i id="gbar"></i></div><span id="form">木綿</span></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hud"><div><span>SCORE</span><b id="score">0</b></div><div style="text-align:right"><span>COMBO</span><b id="combo">0</b></div></div>
    <button id="pauseBtn" hidden>一時停止</button>

    <div class="overlay" id="title">
      
      <h2>定時まで豆腐</h2>
      <p>流れてくる豆腐をプレスラインでタップ。ミスるとメンタルが削れて、ゼロになるとおから。17:00まで形を保てば退勤です。</p>
      <div class="row" id="diffs">
        <button class="opt" data-d="easy" aria-pressed="false">木綿<small>EASY</small></button>
        <button class="opt" data-d="normal" aria-pressed="true">絹ごし<small>NORMAL</small></button>
        <button class="opt" data-d="hard" aria-pressed="false">おぼろ<small>HARD</small></button>
      </div>
      <div class="set">
        <label for="spd">速さ</label><input id="spd" type="range" min="1" max="4" step="0.25" value="2"><output id="spdv">2.00x</output>
        <label for="ofs">ズレ補正</label><input id="ofs" type="range" min="-200" max="200" step="5" value="0"><output id="ofsv">0ms</output>
      </div>
      <button class="start" id="startBtn" disabled><span class="loading">音源ロード中…</span></button>
      <div class="keys">PC：<kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd>　スマホ：レーンをタップ　<kbd>Esc</kbd>で一時停止</div>
    </div>

    <div class="overlay" id="pauseOv" hidden>
      <h2>休憩時間</h2>
      <p>休憩時間は、どこ行った！</p>
      <div class="row"><button class="start" id="resumeBtn">再開</button><button class="opt" id="quitBtn">やめる</button></div>
    </div>

    <div class="overlay" id="result" hidden>
      <div class="stamp" id="stamp">退勤！</div>
      <p id="resMsg"></p>
      <div class="score" id="resScore">0</div>
      <div class="res">
        <div><b id="rP">0</b><span>ヨシ！</span></div>
        <div><b id="rG">0</b><span>まあヨシ</span></div>
        <div><b id="rM">0</b><span>ヨシじゃない</span></div>
        <div><b id="rC">0</b><span>最大コンボ</span></div>
      </div>
      <p id="best"></p>
      <div class="row"><button class="start" id="againBtn">翌日も出勤</button><button class="opt" id="menuBtn">メニュー</button></div>
    </div>
  </div>
  <footer><a href="index.html" style="color:inherit">← 1面・ステージ選択へ</a>　ご安全に！</footer>
</div>

fetch('bgm.mp3').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(b=>{bytes=b;$('startBtn').disabled=false;$('startBtn').textContent='出勤する'})
 .catch(()=>{$('startBtn').innerHTML='<span class="loading">音源を読み込めませんでした。再読み込みしてください</span>'});

async function ensureAudio(){
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')await AC.resume();
  if(!buf)buf=await AC.decodeAudioData(bytes.slice(0));
}
function songTime(){return playing?(AC.currentTime-t0)-offsetMs/1000:0}

async function start(){
  $('startBtn').disabled=true;
  try{await ensureAudio()}catch(e){$('startBtn').disabled=false;return}
  notes=DATA.charts[diff].map(n=>({t:n.t,l:n.l,h:0}));
  next=0;score=0;combo=0;maxc=0;cP=0;cG=0;cM=0;mental=100;fx=[];judge=null;ended=false;
  src=AC.createBufferSource();src.buffer=buf;src.connect(AC.destination);
  const lead=1.6; t0=AC.currentTime+lead; src.start(t0);
  src.onended=()=>{if(playing&&!ended)finish(true)};
  playing=true;paused=false;
  $('title').hidden=true;$('result').hidden=true;$('pauseOv').hidden=true;$('pauseBtn').hidden=false;
  $('startBtn').disabled=false;
  updHud();cancelAnimationFrame(raf);loop();
}
function stopAudio(){try{src&&src.stop()}catch(e){} src=null}
async function pause(){if(!playing||paused||ended)return;paused=true;await AC.suspend();$('pauseOv').hidden=false}
async function resume(){if(!paused)return;$('pauseOv').hidden=true;paused=false;await AC.resume()}
function quit(){playing=false;paused=false;stopAudio();if(AC&&AC.state==='suspended')AC.resume();$('pauseOv').hidden=true;$('pauseBtn').hidden=true;$('title').hidden=false;drawIdle()}

function form(){return mental>66?'木綿':mental>33?'絹ごし':'おぼろ'}
function updHud(){
  $('score').textContent=score.toLocaleString();$('combo').textContent=combo;
  const g=$('gbar');g.style.width=Math.max(0,mental)+'%';g.style.background=mental>66?'var(--ok)':mental>33?'var(--warn)':'var(--bad)';
  $('form').textContent=form();
}
function setClock(t){const r=Math.min(1,Math.max(0,t/DATA.duration));const m=Math.round(480+r*540);
  $('clock').textContent=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}

function judgeHit(lane){
  if(!playing||paused||ended)return;
  lanePress[lane]=performance.now();
  const t=songTime();let best=null,bd=1;
  for(let i=next;i<notes.length;i++){const n=notes[i];if(n.t-t>W_MISS)break;if(n.h||n.l!==lane)continue;const d=Math.abs(n.t-t);if(d<bd){bd=d;best=n}}
  if(!best||bd>W_MISS)return;
  best.h=1;
  if(bd<=W_PERF){cP++;combo++;score+=300+Math.min(combo,100)*2;mental=Math.min(100,mental+1);show('ヨシ！','var(--hazard)')}
  else if(bd<=W_GOOD){cG++;combo++;score+=150+Math.min(combo,100);mental=Math.min(100,mental+.5);show('まあヨシ','var(--tofu)')}
  else{miss();return}
  maxc=Math.max(maxc,combo);burst(lane);updHud();
}
const MISS_LINES=['ヨシじゃない！','前にも言ったよね','普通できるでしょ','空気読んで','君のためだよ'];
function miss(){cM++;combo=0;mental-=diff==='easy'?5:diff==='normal'?6:7;
  show(cM%4===0?MISS_LINES[1+(cM/4)%4|0]:MISS_LINES[0],'var(--bad)');updHud();
  if(mental<=0){mental=0;updHud();finish(false)}}
function show(txt,col){judge={txt,col,at:performance.now()}}
function burst(l){for(let i=0;i<10;i++)fx.push({l,x:0,y:0,vx:(Math.random()-.5)*5,vy:-Math.random()*5-1,a:1,s:Math.random()*4+2})}

function finish(clear){
  if(ended)return;ended=true;playing=false;stopAudio();$('pauseBtn').hidden=true;
  const tot=notes.length,acc=tot?(cP+cG*.5)/tot:0;
  const st=$('stamp');
  if(clear){st.textContent='退勤！';st.className='stamp good';
    $('resMsg').textContent=acc>.95?'完全定時退勤。工程完了、ヨシ！':acc>.85?'木綿のまま帰宅。明日のことなら明日でいい。':acc>.7?'絹ごしくらいで帰れた。帰れりゃ今日は工程完了。':'おぼろだけど、帰れた。勝ちは勝ち。';}
  else{st.textContent='おから';st.className='stamp';
    $('resMsg').textContent='メンタル残量ゼロ。'+$('clock').textContent+'に工程停止。';}
  $('resScore').textContent=score.toLocaleString();
  $('rP').textContent=cP;$('rG').textContent=cG;$('rM').textContent=cM+(clear?0:0);$('rC').textContent=maxc;
  const k='tofu_best_'+diff,b=+(ls(k)||0);
  if(clear&&score>b){ls(k,score);$('best').textContent='自己ベスト更新（'+({easy:'木綿',normal:'絹ごし',hard:'おぼろ'})[diff]+'）';}
  else $('best').textContent=b?('自己ベスト '+b.toLocaleString()):'';
  $('result').hidden=false;
}

// ---- drawing ----
let Wd=0,Hd=0,dpr=1;
function resize(){const r=$('stage').getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);Wd=r.width;Hd=r.height;cv.width=Wd*dpr;cv.height=Hd*dpr;cx.setTransform(dpr,0,0,dpr,0,0);if(!playing)drawIdle()}
addEventListener('resize',resize);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let C={};function cols(){C={steel2:css('--steel-2'),steel3:css('--steel-3'),tofu:css('--tofu'),shade:css('--tofu-shade'),haz:css('--hazard'),dim:css('--dim')}}
function geo(){const lw=Math.min(90,(Wd-24)/LANES);const x0=(Wd-lw*LANES)/2;const hitY=Hd-Math.max(70,Hd*.16);return{lw,x0,hitY}}
function drawBoard(t){
  const {lw,x0,hitY}=geo();
  cx.fillStyle=C.steel2;cx.fillRect(0,0,Wd,Hd);
  // conveyor belts
  const pxps=speed*230;
  for(let i=0;i<LANES;i++){const x=x0+i*lw;
    cx.fillStyle=i%2?'#202326':'#1d2023';cx.fillRect(x+2,0,lw-4,Hd);
    const lit=performance.now()-lanePress[i]<120;
    if(lit){const g=cx.createLinearGradient(0,hitY-160,0,hitY);g.addColorStop(0,'rgba(242,194,48,0)');g.addColorStop(1,'rgba(242,194,48,.22)');cx.fillStyle=g;cx.fillRect(x+2,hitY-160,lw-4,160)}
    cx.strokeStyle='rgba(255,255,255,.05)';cx.lineWidth=2;
    const ph=((t*pxps)%36+36)%36;
    for(let y=-36+ph;y<hitY;y+=36){cx.beginPath();cx.moveTo(x+6,y);cx.lineTo(x+lw-6,y);cx.stroke()}
  }
  // press line with hazard stripes
  cx.save();cx.beginPath();cx.rect(x0,hitY-5,lw*LANES,10);cx.clip();
  cx.fillStyle='#111';cx.fillRect(x0,hitY-5,lw*LANES,10);cx.fillStyle=C.haz;
  for(let x=x0-20;x<x0+lw*LANES+20;x+=16){cx.beginPath();cx.moveTo(x,hitY+5);cx.lineTo(x+8,hitY+5);cx.lineTo(x+18,hitY-5);cx.lineTo(x+10,hitY-5);cx.fill()}
  cx.restore();
  // lane keys
  cx.font='13px DotGothic16, monospace';cx.textAlign='center';cx.textBaseline='middle';
  for(let i=0;i<LANES;i++){const x=x0+i*lw+lw/2;const lit=performance.now()-lanePress[i]<120;
    cx.fillStyle=lit?C.haz:C.steel3;cx.fillRect(x0+i*lw+6,hitY+16,lw-12,Math.min(44,Hd-hitY-24));
    cx.fillStyle=lit?'#1b1d1f':C.dim;cx.fillText(KEYS[i].toUpperCase(),x,hitY+16+Math.min(44,Hd-hitY-24)/2)}
  return{lw,x0,hitY,pxps};
}
function tofu(x,y,w,h,sq,seed){
  // flatter as mental drops (same idea as the main stage: 木綿 → 絹ごし → おぼろ)
  const m=(document.getElementById('title').hidden)?mental:100;
  const f=m>66?1:m>33?.86:.72, nh=h*f, ny=y+(h-nh), ex=(1-f)*w*.06;
  x-=ex; w+=ex*2; h=nh; y=ny;
  cx.fillStyle=C.shade;rr(x,y+3,w,h,6*sq);cx.fill();
  cx.fillStyle=C.tofu;rr(x,y,w,h,6*sq);cx.fill();
  cx.fillStyle='rgba(255,255,255,.55)';cx.fillRect(x+6,y+4,w*.3,2);
  // face, modeled on the 3D tofu: two dot eyes, arc mouth, pink cheeks when cheerful, sweat when worn out
  const cxm=x+w/2, u=Math.min(h,w*.5), eyeY=y+h*.4, gap=u*.42;
  const blink=(((performance.now()/1000)+(seed||0)*1.37)%3.4)<.12;
  const sad=m<=50;
  cx.fillStyle='#1b1d1f';
  const er=Math.max(1.6,u*.075), eh=blink?er*.25:er*1.25*(sad?.8:1);
  cx.beginPath();cx.ellipse(cxm-gap,eyeY,er,eh,0,0,Math.PI*2);cx.ellipse(cxm+gap,eyeY,er,eh,0,0,Math.PI*2);cx.fill();
  cx.strokeStyle='#1b1d1f';cx.lineWidth=Math.max(1.2,u*.045);cx.lineCap='round';
  const mr=u*.13, my=y+h*.66;
  cx.beginPath();
  if(sad)cx.arc(cxm,my+mr*.9,mr,Math.PI*1.15,Math.PI*1.85);else cx.arc(cxm,my-mr*.35,mr,Math.PI*.15,Math.PI*.85);
  cx.stroke();
  if(m>75){cx.fillStyle='rgba(242,167,160,.85)';const cr=Math.max(1.5,u*.08);
    cx.beginPath();cx.arc(cxm-gap*1.75,y+h*.6,cr,0,Math.PI*2);cx.arc(cxm+gap*1.75,y+h*.6,cr,0,Math.PI*2);cx.fill()}
  if(m<=35){const sx=x+w-u*.25,sy=y+h*.25+Math.sin(performance.now()/160+(seed||0))*1.5,sr=Math.max(2,u*.09);
    cx.fillStyle='rgba(143,208,255,.9)';cx.beginPath();cx.moveTo(sx,sy-sr*1.8);cx.quadraticCurveTo(sx+sr,sy,sx,sy+sr);cx.quadraticCurveTo(sx-sr,sy,sx,sy-sr*1.8);cx.fill()}
}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function loop(){
  raf=requestAnimationFrame(loop);
  const t=songTime();
  // auto-miss
  while(next<notes.length&&(notes[next].h||t-notes[next].t>W_MISS)){if(!notes[next].h&&playing&&!ended){notes[next].h=2;miss()}next++}
  setClock(Math.max(0,t));
  const {lw,x0,hitY,pxps}=drawBoard(t);
  const sq=mental>66?1:mental>33?1.8:2.6, nh=Math.max(20,lw*.44);
  for(let i=next;i<notes.length;i++){const n=notes[i];const y=hitY-(n.t-t)*pxps;if(y<-40)break;if(n.h)continue;
    tofu(x0+n.l*lw+8,y-nh/2,lw-16,nh,sq,i)}
  // fx
  for(const p of fx){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.a-=.03;
    cx.globalAlpha=Math.max(0,p.a);cx.fillStyle=C.tofu;cx.fillRect(x0+p.l*lw+lw/2+p.x,hitY+p.y,p.s,p.s)}
  cx.globalAlpha=1;fx=fx.filter(p=>p.a>0);
  if(judge){const age=performance.now()-judge.at;if(age<500){cx.globalAlpha=1-age/500;cx.font='26px "Dela Gothic One", sans-serif';cx.textAlign='center';
    cx.fillStyle=judge.col.startsWith('var')?css(judge.col.slice(4,-1)):judge.col;
    cx.fillText(judge.txt,Wd/2,hitY-90-age*.03);cx.globalAlpha=1}}
  if(t<0){cx.font='22px DotGothic16, monospace';cx.fillStyle=C.haz;cx.textAlign='center';cx.fillText(t<-1.0?'READY?':'ご安全に！',Wd/2,Hd*.4)}
  if(!playing&&!paused)cancelAnimationFrame(raf);
}
function drawIdle(){cols();if(!Wd)return;const {lw,x0,hitY}=drawBoard(0);const nh=Math.max(20,lw*.44);
  const demo=(DATA.charts[diff]||[]).slice(6,20);for(const n of demo){const y=hitY-(n.t-demo[0].t+.5)*speed*230;if(y>0)tofu(x0+n.l*lw+8,y-nh/2,lw-16,nh,1,n.t)}}

// ---- input ----
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();const i=KEYS.indexOf(k);
  if(i>=0){e.preventDefault();judgeHit(i)}
  else if(e.key==='Escape'){paused?resume():pause()}
  else if((e.key===' '||e.key==='Enter')&&!$('title').hidden&&!$('startBtn').disabled&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();start()}});
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();const {lw,x0}=geo();const i=Math.floor((e.clientX-r.left-x0)/lw);if(i>=0&&i<LANES)judgeHit(i)});
$('startBtn').onclick=start;$('againBtn').onclick=start;$('menuBtn').onclick=()=>{$('result').hidden=true;$('title').hidden=false;drawIdle()};
$('pauseBtn').onclick=pause;$('resumeBtn').onclick=resume;$('quitBtn').onclick=quit;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
cols();resize();
if(document.fonts)document.fonts.ready.then(()=>{if(!playing)drawIdle()});
</script>
